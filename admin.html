<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | KRV Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            padding: 50px 20px;
            max-width: 1200px;
            margin: 80px auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            box-shadow: var(--shadow);
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: var(--primary-color);
            color: white;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-new { background: #e3f2fd; color: #1976d2; }
        .login-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-light);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
        }
        .tab-btn {
            padding: 10px 25px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: 600;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div id="loginSection" class="login-screen">
        <div class="login-card">
            <h2 class="text-center pink-text">Admin Login</h2>
            <p class="text-center text-muted" style="margin-bottom: 25px;">Enter credentials to access leads</p>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" class="form-control" placeholder="Default: admin123">
            </div>
            <button onclick="checkLogin()" class="btn btn-primary w-100" style="width: 100%;">Login</button>
        </div>
    </div>

    <div id="adminSection" style="display: none;">
        <header class="sticky">
            <div class="container nav-wrapper">
                <a href="index.html" class="logo">KRV <span>Admin</span></a>
                <button onclick="logout()" class="btn btn-outline btn-sm">Logout</button>
            </div>
        </header>

        <div class="admin-container">
            <div style="display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee;">
                <button class="tab-btn active" onclick="switchTab('leads', this)">Leads</button>
                <button class="tab-btn" onclick="switchTab('orders', this)">Orders</button>
            </div>

            <div id="leadsSection">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Form Enquiries</h2>
                    <button onclick="clearLeads()" class="btn btn-outline" style="color: red; border-color: red;">Clear Leads</button>
                </div>
                <div id="leadsTableWrapper"></div>
            </div>

            <div id="ordersSection" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Service Orders</h2>
                    <button onclick="clearOrders()" class="btn btn-outline" style="color: red; border-color: red;">Clear Orders</button>
                </div>
                <div id="ordersTableWrapper"></div>
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === 'admin123') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                loadLeads();
            } else {
                alert('Invalid Password!');
            }
        }

        function logout() {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('adminSection').style.display = 'none';
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (tab === 'leads') {
                document.getElementById('leadsSection').style.display = 'block';
                document.getElementById('ordersSection').style.display = 'none';
                loadLeads();
            } else {
                document.getElementById('leadsSection').style.display = 'none';
                document.getElementById('ordersSection').style.display = 'block';
                loadOrders();
            }
        }

        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('krv_orders') || '[]');
            const wrapper = document.getElementById('ordersTableWrapper');

            if (orders.length === 0) {
                wrapper.innerHTML = '<p class="text-center" style="margin-top: 50px;">No orders found yet.</p>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>`;

            orders.reverse().forEach(order => {
                html += `<tr>
                    <td>${order.date}</td>
                    <td>#${order.id}</td>
                    <td>${order.customer ? order.customer.name : 'Unknown'}</td>
                    <td>₹${order.total}</td>
                    <td><span class="status-badge status-new">${order.status}</span></td>
                </tr>`;
            });

            html += '</tbody></table>';
            wrapper.innerHTML = html;
        }

        function clearOrders() {
            if (confirm('Delete all orders?')) {
                localStorage.removeItem('krv_orders');
                loadOrders();
            }
        }

        function loadLeads() {
            const leads = JSON.parse(localStorage.getItem('krv_leads') || '[]');
            const wrapper = document.getElementById('leadsTableWrapper');

            if (leads.length === 0) {
                wrapper.innerHTML = '<p class="text-center" style="margin-top: 50px;">No leads found yet.</p>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody>`;

            leads.reverse().forEach(lead => {
                html += `<tr>
                    <td>${lead.date}</td>
                    <td>${lead.name}</td>
                    <td>${lead.email}</td>
                    <td>${lead.phone}</td>
                    <td>${lead.service}</td>
                    <td>${lead.message}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            wrapper.innerHTML = html;
        }

        function clearLeads() {
            if (confirm('Are you sure you want to delete all leads?')) {
                localStorage.removeItem('krv_leads');
                loadLeads();
            }
        }
    </script>
</body>
</html>
