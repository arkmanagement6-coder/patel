<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | KRV Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--bg-light);">

    <header class="sticky">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">KRV <span>Management</span></a>
            <a href="services.html" class="nav-link">Continue Shopping</a>
        </div>
    </header>

    <div class="container" style="margin-top: 120px;">
        <h2 class="pink-text">🛒 Shopping Cart</h2>
        
        <div id="cartContent" style="margin-top: 30px;">
            <!-- Cart items will be injected here -->
        </div>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('krv_cart') || '[]');
            const wrapper = document.getElementById('cartContent');
            
            if (cart.length === 0) {
                wrapper.innerHTML = `
                    <div class="text-center" style="padding: 50px; background: white; border-radius: 12px;">
                        <i class="fas fa-shopping-basket" style="font-size: 4rem; color: #eee; margin-bottom: 20px;"></i>
                        <h3>Your cart is empty</h3>
                        <a href="services.html" class="btn btn-primary" style="margin-top: 20px;">Explore Services</a>
                    </div>`;
                return;
            }

            let total = 0;
            let html = '<div class="checkout-grid"><div>';
            
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="service-card-v2" style="margin-bottom: 15px; flex-direction: row; justify-content: space-between; align-items: center;">
                        <div>
                            <h4>${item.name}</h4>
                            <p class="pink-text font-bold">₹${item.price}</p>
                        </div>
                        <button onclick="removeItem(${index})" class="btn" style="color: red;"><i class="fas fa-trash"></i></button>
                    </div>`;
            });

            html += `</div>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                        <span>Subtotal:</span>
                        <span>₹${total}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 10px; font-weight: 700; border-top: 1px solid #ddd; padding-top: 10px;">
                        <span>Total:</span>
                        <span>₹${total}</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary w-100" style="width: 100%; margin-top: 20px; text-align: center;">Proceed to Checkout</a>
                </div>
            </div>`;
            
            wrapper.innerHTML = html;
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('krv_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('krv_cart', JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
