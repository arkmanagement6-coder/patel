<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | KRV Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--bg-light);">

    <header class="sticky">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">KRV <span>Management</span></a>
            <a href="cart.html" class="nav-link">Back to Cart</a>
        </div>
    </header>

    <div class="container" style="margin-top: 120px;">
        <h2 class="pink-text">Billing Details</h2>
        
        <form onsubmit="handleCheckout(event)">
            <div class="checkout-grid" style="margin-top: 30px;">
                <div>
                    <div class="service-card-v2">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="billName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="billEmail" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="billPhone" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <textarea id="billAddress" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                </div>

                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div id="summaryItems"></div>
                    <div id="totalSection"></div>
                    <button type="submit" class="btn btn-primary w-100" style="width: 100%; margin-top: 30px;">Proceed to Payment</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        function renderSummary() {
            const cart = JSON.parse(localStorage.getItem('krv_cart') || '[]');
            const user = JSON.parse(localStorage.getItem('krv_user'));
            
            if (user) {
                document.getElementById('billName').value = user.name;
                document.getElementById('billEmail').value = user.email;
                document.getElementById('billPhone').value = user.phone;
            }

            let total = 0;
            let html = '';
            cart.forEach(item => {
                total += item.price;
                html += `<div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>${item.name}</span>
                    <span>₹${item.price}</span>
                </div>`;
            });
            document.getElementById('summaryItems').innerHTML = html;
            document.getElementById('totalSection').innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-top: 20px; font-weight: 700; border-top: 1px solid #ddd; padding-top: 10px;">
                    <span>Total:</span>
                    <span>₹${total}</span>
                </div>`;
        }

        function handleCheckout(e) {
            e.preventDefault();
            const billing = {
                name: document.getElementById('billName').value,
                email: document.getElementById('billEmail').value,
                phone: document.getElementById('billPhone').value,
                address: document.getElementById('billAddress').value
            };
            localStorage.setItem('krv_billing', JSON.stringify(billing));
            window.location.href = 'payment.html';
        }

        renderSummary();
    </script>
</body>
</html>
