<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | KRV Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--bg-light);">

    <div class="container text-center" style="margin-top: 150px;">
        <div class="service-card-v2" style="max-width: 600px; margin: 0 auto; padding: 50px;">
            <div style="font-size: 4rem; color: #25d366; margin-bottom: 20px;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="pink-text">✅ Payment Successful</h2>
            <p style="margin-top: 10px;">Your order has been placed successfully.</p>
            
            <div style="background: var(--bg-light); padding: 20px; border-radius: 8px; margin: 30px 0; text-align: left;">
                <p><strong>Order ID:</strong> <span id="orderIdDisplay">#123456</span></p>
                <p><strong>Delivery Timeline:</strong> 3-5 Working Days</p>
            </div>

            <p class="text-muted">An email confirmation has been sent to your registered email address.</p>
            
            <div style="margin-top: 30px; display: flex; gap: 15px; justify-content: center;">
                <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
                <a href="index.html" class="btn btn-outline">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        if (orderId) {
            document.getElementById('orderIdDisplay').innerText = '#' + orderId;
        }
    </script>
</body>
</html>
